name: Storybook CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/components-lib/**"
      - ".github/workflows/storybook-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/components-lib/**"
      - ".github/workflows/storybook-ci.yml"

jobs:
  build-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        working-directory: apps/components-lib
        run: npm run storybook:build

      - name: Archive Storybook build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-build
          path: apps/components-lib/storybook-static
          retention-days: 7

      - name: Comment PR with Storybook link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Storybook built successfully! Check visual changes in the artifacts.'
            })
