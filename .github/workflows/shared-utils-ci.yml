name: Shared Utils CI

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/shared-utils/**"
      - ".github/workflows/shared-utils-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/shared-utils/**"
      - ".github/workflows/shared-utils-ci.yml"

env:
  NODE_VERSION: "20"

jobs:
  test:
    name: packages/shared-utils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: packages/shared-utils/node_modules
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-shared-utils-${{ hashFiles("packages/shared-utils/package-lock.json") }}
          restore-keys: ${{ runner.os }}-node${{ env.NODE_VERSION }}-shared-utils-
      - name: Install
        working-directory: packages/shared-utils
        run: npm ci
      - name: Typecheck
        working-directory: packages/shared-utils
        run: npx tsc --noEmit
      - name: Test
        working-directory: packages/shared-utils
        run: npm run test:coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/shared-utils/coverage/coverage-final.json
          flags: shared-utils
          fail_ci_if_error: false
