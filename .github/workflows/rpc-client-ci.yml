name: RPC Client CI

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/rpc-client/**"
      - ".github/workflows/rpc-client-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/rpc-client/**"
      - ".github/workflows/rpc-client-ci.yml"

env:
  NODE_VERSION: "20"

jobs:
  test:
    name: packages/rpc-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: packages/rpc-client/node_modules
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-rpc-client-${{ hashFiles("packages/rpc-client/package-lock.json") }}
          restore-keys: ${{ runner.os }}-node${{ env.NODE_VERSION }}-rpc-client-
      - name: Install
        working-directory: packages/rpc-client
        run: npm ci
      - name: Typecheck
        working-directory: packages/rpc-client
        run: npx tsc --noEmit
      - name: Test
        working-directory: packages/rpc-client
        run: npm run test:coverage
