[workspace]
resolver = "2"
members = [
  "contracts/*",
]
exclude = ["contracts/benchmarks"]

[workspace.metadata.docs]
# Run `cargo doc --workspace --no-deps --document-private-items` to build docs locally.
# The GitHub Actions workflow `.github/workflows/docs.yml` builds and deploys to GitHub Pages.
output-dir = "target/doc"

[workspace.dependencies]
soroban-sdk = "25.3.0"

[profile.release]
# Optimized for minimal WASM binary size:
# opt-level="z" minimizes code size; lto eliminates dead code; codegen-units=1
# enables full optimization; panic="abort" avoids unwind info; strip="symbols"
# removes debug symbols; overflow-checks=false reduces runtime overhead
# (contracts use checked_mul/checked_div for safety instead).
opt-level = "z"
overflow-checks = false
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
