[package]
name = "crowdfund-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
crowdfund    = { path = "../crowdfund" }
achievements = { path = "../achievements" }
qf           = { path = "../qf" }
registry     = { path = "../registry" }
soroban-sdk  = { version = "25.3.0", features = ["testutils"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "contract_benchmarks"
harness = false

[[bench]]
name = "registry_benchmarks"
harness = false

[[bench]]
name = "achievements_benchmarks"
harness = false

[[bench]]
name = "qf_benchmarks"
harness = false
