[package]
name = "crowdfund"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
common = { path = "../common", features = ["testutils"] }
proptest = "1.4"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]
fuzz = []